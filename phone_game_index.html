<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title></title>
<style>
:root{color-scheme:dark;--blue:#0a84ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}button{font:inherit;color:inherit;border:0;background:none}.phone{position:relative;width:100%;height:100dvh;overflow:hidden;background:#000}.status{position:absolute;z-index:10;top:0;left:0;right:0;height:48px;padding:12px 27px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:650}.right{display:flex;align-items:center;gap:6px}.bars{display:flex;align-items:flex-end;gap:2px;height:13px}.bars i{width:3px;background:#fff;border-radius:1px}.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}.wifi{width:16px}.battery{width:23px;height:12px;border:1.4px solid #fff;border-radius:3px;padding:1.5px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#fff}.battery i{display:block;width:82%;height:100%;background:#fff;border-radius:1px}.lock,.home{position:absolute;inset:0;background:#000;transition:opacity .28s,transform .28s}.lock.gone{opacity:0;transform:scale(1.02);pointer-events:none}.tinylock{position:absolute;top:calc(env(safe-area-inset-top) + 63px);left:0;right:0;text-align:center}.tinylock svg{width:14px;height:17px}.date{position:absolute;top:calc(env(safe-area-inset-top) + 106px);left:0;right:0;text-align:center;font-size:19px;font-weight:500}.clock{position:absolute;top:calc(env(safe-area-inset-top) + 125px);left:0;right:0;text-align:center;font-size:clamp(82px,23vw,106px);font-weight:300;letter-spacing:-5px;line-height:1.1;font-variant-numeric:tabular-nums}.notifs{position:absolute;top:calc(env(safe-area-inset-top) + 270px);left:12px;right:12px;display:flex;flex-direction:column;gap:8px}.notif{display:flex;gap:11px;padding:11px 13px;min-height:72px;border-radius:21px;background:rgba(48,48,50,.82);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);opacity:0;transform:translateY(-7px);animation:arrive .38s ease forwards;cursor:pointer}@keyframes arrive{to{opacity:1;transform:translateY(0)}}.msgicon{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:linear-gradient(140deg,#62d66c,#20b743);display:grid;place-items:center}.msgicon svg{width:25px}.nbody{flex:1;min-width:0}.nhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.nname{font-size:14px;font-weight:650}.ntime{font-size:12px;color:#aaa}.ntext{font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 40px);left:0;right:0;display:flex;justify-content:space-between;padding:0 32px}.circle{width:48px;height:48px;border-radius:50%;background:rgba(120,120,125,.25);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}.circle svg{width:22px;height:22px}.indicator{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:#fff}.swipe{position:absolute;bottom:0;left:0;right:0;height:35px}.pass{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}.pass.show{opacity:1;pointer-events:auto}.pass h2{font-size:22px;font-weight:600;margin:calc(env(safe-area-inset-top) + 94px) 0 0}.dots{display:flex;gap:19px;margin-top:31px}.dot{width:11px;height:11px;border:1px solid #ddd;border-radius:50%}.dot.fill{background:#fff}.keys{width:min(280px,78vw);display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px;margin-top:36px}.key{aspect-ratio:1;max-height:75px;border-radius:50%;background:#333336;display:flex;flex-direction:column;align-items:center;justify-content:center}.key:active{background:#646468}.num{font-size:32px;font-weight:400;line-height:1}.letters{font-size:9px;letter-spacing:2px;min-height:12px;margin-top:4px;font-weight:600}.blank{visibility:hidden}.del{font-size:13px;background:transparent}.passbottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 48px);left:0;right:0;padding:0 35px;display:flex;justify-content:space-between;color:var(--blue);font-size:15px}.error{position:absolute;top:calc(env(safe-area-inset-top) + 70px);color:#ff453a;font-size:14px;opacity:0}.error.show{opacity:1}.shake{animation:shake .25s ease}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}.home{opacity:0;pointer-events:none;z-index:15}.home.show{opacity:1;pointer-events:auto}.hometop{position:absolute;top:calc(env(safe-area-inset-top) + 62px);left:24px;right:24px;display:flex;justify-content:space-between;font-size:14px;color:#ddd}.widgets{position:absolute;top:calc(env(safe-area-inset-top) + 106px);left:20px;right:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.widget{height:112px;background:#1c1c1e;border-radius:22px;padding:13px;display:flex;flex-direction:column;justify-content:space-between}.muted{color:#aaa;font-size:12px}.widget b{font-size:20px}.apps{position:absolute;top:calc(env(safe-area-inset-top) + 244px);left:20px;right:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:23px 8px}.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}.appicon{width:min(61px,16vw);height:min(61px,16vw);border-radius:15px;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 .5px #ffffff28}.appicon svg{width:34px;height:34px}.appname{font-size:11px;white-space:nowrap}.badge{position:absolute;right:-5px;top:-5px;border:1.5px solid #000;background:#ff453a;border-radius:12px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px;font-size:11px}.search{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 124px);left:50%;transform:translateX(-50%);border-radius:18px;background:#ffffff24;padding:5px 13px;font-size:12px;color:#ddd}.dock{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 25px);left:13px;right:13px;height:84px;border-radius:26px;background:#ffffff24;display:flex;justify-content:space-evenly;align-items:center;backdrop-filter:blur(24px)}.dock .appicon{width:min(57px,15vw);height:min(57px,15vw);border-radius:14px}.dock .appname{display:none}.view{position:absolute;inset:0;z-index:30;background:#f2f2f7;color:#111;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}.view.show{opacity:1;pointer-events:auto;transform:none}.apphead{height:calc(env(safe-area-inset-top) + 58px);padding:calc(env(safe-area-inset-top) + 12px) 18px 8px;display:flex;align-items:center;justify-content:space-between;color:#087cff;font-size:17px}.apphead strong{color:#111}.content{padding:12px 18px}.contact{text-align:center;padding:5px 0 16px;border-bottom:1px solid #d7d7dc}.avatar{width:62px;height:62px;border-radius:50%;background:#aaaab0;color:white;display:grid;place-items:center;margin:0 auto 7px;font-size:24px}.sub{font-size:12px;color:#777;margin-top:4px}.chat{height:calc(100dvh - 235px);overflow:auto;padding:15px 0;display:flex;flex-direction:column;gap:10px}.bubble{max-width:84%;padding:10px 14px;background:#e5e5ea;color:#111;border-radius:19px 19px 19px 6px;font-size:16px;line-height:1.35;overflow-wrap:anywhere}.chattime{text-align:center;color:#888;font-size:11px;margin:7px 0}.inputfake{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);left:12px;right:12px;height:43px;border:1px solid #c7c7cc;border-radius:24px;color:#777;display:flex;align-items:center;padding:0 14px;background:#fff;font-size:15px}.sheet{background:#fff;border-radius:15px;padding:14px;margin-bottom:12px;font-size:15px;line-height:1.55}.row{padding:12px 0;border-bottom:1px solid #ddd}.row:last-child{border:0}.back{color:#087cff}
@media(min-width:600px){.phone{max-width:430px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}body{background:#151515}}
</style>
</head>
<body><main class="phone">
<div class="status"><span id="statusTime">15:00</span><div class="right"><span class="bars"><i></i><i></i><i></i><i></i></span><svg class="wifi" viewBox="0 0 20 15" fill="none"><path d="M1 4.5C6.4.2 13.6.2 19 4.5M4 7.5c3.5-2.8 8.5-2.8 12 0M7.2 10.5c1.7-1.4 3.9-1.4 5.6 0" stroke="white" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="13" r="1.1" fill="white"/></svg><span class="battery"><i></i></span></div></div>
<section class="lock" id="lock">
<div class="tinylock"><svg viewBox="0 0 20 22" fill="none"><rect x="3" y="9" width="14" height="11" rx="2.5" stroke="white" stroke-width="1.6"/><path d="M6 9V6a4 4 0 0 1 8 0v3" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg></div>
<div class="date">10월 20일 화요일</div><div class="clock" id="clock">15:00</div>
<div class="notifs" id="notifs"></div>
<div class="controls"><button class="circle" id="flash" aria-label="손전등"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8l-1 5 2 3v8H7v-8l2-3-1-5Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 8h8M9 13h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></button><button class="circle" id="camera" aria-label="카메라"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5h4l1.5-2h5L16 8.5h4v10H4v-10Z" stroke="white" stroke-width="1.7"/><circle cx="12" cy="13.5" r="3.2" stroke="white" stroke-width="1.7"/></svg></button></div><div class="indicator" id="lockIndicator"></div><div class="swipe" id="swipe"></div>
</section>
<section class="pass" id="pass"><div class="error" id="error">암호가 올바르지 않습니다.</div><h2>암호 입력</h2><div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="keys" id="keys">
<button class="key" data-n="1"><span class="num">1</span><span class="letters"></span></button><button class="key" data-n="2"><span class="num">2</span><span class="letters">ABC</span></button><button class="key" data-n="3"><span class="num">3</span><span class="letters">DEF</span></button>
<button class="key" data-n="4"><span class="num">4</span><span class="letters">GHI</span></button><button class="key" data-n="5"><span class="num">5</span><span class="letters">JKL</span></button><button class="key" data-n="6"><span class="num">6</span><span class="letters">MNO</span></button>
<button class="key" data-n="7"><span class="num">7</span><span class="letters">PQRS</span></button><button class="key" data-n="8"><span class="num">8</span><span class="letters">TUV</span></button><button class="key" data-n="9"><span class="num">9</span><span class="letters">WXYZ</span></button>
<button class="key blank"></button><button class="key" data-n="0"><span class="num">0</span><span class="letters"></span></button><button class="key del" id="del">삭제</button></div><div class="passbottom"><button id="cancel">취소</button><button id="emergency">긴급통화</button></div><div class="indicator"></div></section>
<section class="home" id="home">
<div class="hometop"><span>화요일, 10월 20일</span><span>●●●</span></div>
<div class="widgets"><div class="widget"><span class="muted">화요일 · 10월 20일</span><b>오늘</b><span class="muted">예정된 일정 2개</span></div><div class="widget"><span class="muted">날씨</span><b>—°</b><span class="muted">위치 서비스 꺼짐</span></div></div>
<div class="apps">
<div class="app" data-app="messages"><div class="appicon" style="background:#28c840"><svg viewBox="0 0 40 40"><path d="M8 9.5A3.5 3.5 0 0 1 11.5 6h17A3.5 3.5 0 0 1 32 9.5v13a3.5 3.5 0 0 1-3.5 3.5H18l-7 5v-5h-.5A3.5 3.5 0 0 1 7 22.5v-13Z" fill="white"/></svg><i class="badge">3</i></div><span class="appname">메시지</span></div>
<div class="app" data-app="calendar"><div class="appicon" style="background:#fff;color:#ff3b30;display:flex;flex-direction:column;justify-content:center"><span style="font-size:10px;font-weight:700">화</span><span style="font-size:28px;line-height:1">20</span></div><span class="appname">캘린더</span></div>
<div class="app" data-app="photos"><div class="appicon" style="background:#fff"><svg viewBox="0 0 40 40"><g transform="translate(20 20)"><ellipse cy="-7" rx="5" ry="9" fill="#ff453a"/><ellipse cy="-7" rx="5" ry="9" fill="#ff9f0a" transform="rotate(60)"/><ellipse cy="-7" rx="5" ry="9" fill="#ffd60a" transform="rotate(120)"/><ellipse cy="-7" rx="5" ry="9" fill="#30d158" transform="rotate(180)"/><ellipse cy="-7" rx="5" ry="9" fill="#0a84ff" transform="rotate(240)"/><ellipse cy="-7" rx="5" ry="9" fill="#bf5af2" transform="rotate(300)"/><circle r="4" fill="white"/></g></svg></div><span class="appname">사진</span></div>
<div class="app" data-app="camera"><div class="appicon" style="background:linear-gradient(#555,#202020)"><svg viewBox="0 0 40 40"><path d="M6 13h7l2.5-3h9l2.5 3h7v17H6Z" fill="#ddd"/><circle cx="20" cy="21" r="7" fill="#333" stroke="#888" stroke-width="2"/></svg></div><span class="appname">카메라</span></div>
<div class="app" data-app="notes"><div class="appicon" style="background:linear-gradient(#ffe65a 0 25%,#fff 25%)"><svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="26" rx="3" fill="white"/><path d="M11 17h18M11 22h18M11 27h14" stroke="#c7c7cc" stroke-width="1.5"/></svg></div><span class="appname">메모</span></div>
<div class="app" data-app="maps"><div class="appicon" style="background:#fff"><svg viewBox="0 0 40 40"><path d="M5 10 15 6l10 4 10-4v24l-10 4-10-4-10 4Z" fill="#b6e4ba"/><path d="M15 6v24M25 10v24" stroke="white" stroke-width="2"/><path d="M20 8c-5 0-8 4-8 8 0 6 8 14 8 14s8-8 8-14c0-4-3-8-8-8Z" fill="#0a84ff"/><circle cx="20" cy="16" r="2.5" fill="white"/></svg></div><span class="appname">지도</span></div>
<div class="app" data-app="mail"><div class="appicon" style="background:#0a84ff"><svg viewBox="0 0 40 40"><rect x="5" y="9" width="30" height="22" rx="4" fill="white"/><path d="m7 12 13 10 13-10" stroke="#0a84ff" stroke-width="2.3" fill="none"/></svg><i class="badge">12</i></div><span class="appname">메일</span></div>
<div class="app" data-app="settings"><div class="appicon" style="background:linear-gradient(#bbb,#777)"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="#eee"/><circle cx="20" cy="20" r="6" fill="#888"/></svg></div><span class="appname">설정</span></div>
</div><div class="search">⌕　검색</div>
<div class="dock">
<div class="app" data-app="phone"><div class="appicon" style="background:#28c840"><svg viewBox="0 0 40 40"><path d="M12 7c-2-1-5 2-5 5 0 9 12 21 21 21 3 0 6-3 5-5l-6-5-5 4c-4-2-7-5-9-9l4-5-5-6Z" fill="white"/></svg></div><span class="appname">전화</span></div>
<div class="app" data-app="safari"><div class="appicon" style="background:#fff"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#0a84ff"/><circle cx="20" cy="20" r="12" fill="#d9f2ff"/><path d="m24 15-3 8-5 2 3-8Z" fill="#ff453a"/></svg></div><span class="appname">Safari</span></div>
<div class="app" data-app="music"><div class="appicon" style="background:linear-gradient(145deg,#ff5f7e,#bf2bce)"><svg viewBox="0 0 40 40"><path d="M25 8v19.5a5 5 0 1 1-3-4.6V13l12-3v14.5a5 5 0 1 1-3-4.6V6l-6 2Z" fill="white"/></svg></div><span class="appname">음악</span></div>
<div class="app" data-app="kakao"><div class="appicon" style="background:#fee500"><svg viewBox="0 0 40 40"><path d="M20 8C11.7 8 5 13.1 5 19.4c0 4 2.7 7.5 6.8 9.5l-1.5 5.4 6.7-3.8c1 .2 2 .3 3 .3 8.3 0 15-5.1 15-11.4S28.3 8 20 8Z" fill="#3c1e1e"/></svg></div><span class="appname">카카오톡</span></div>
</div><div class="indicator"></div></section>
<section class="view" id="view"><div class="apphead"><button class="back" id="back">‹ 홈</button><strong id="title">메시지</strong><span style="width:38px"></span></div><div class="content" id="content"></div><div class="indicator" style="background:#111"></div></section>
</main>
<script>
(()=>{const $=s=>document.querySelector(s), lock=$('#lock'),pass=$('#pass'),home=$('#home'),view=$('#view'),notifs=$('#notifs'),dots=[...document.querySelectorAll('.dot')];let value='',unlocked=false,ctx=null;
const msgs=['이도원 개새끼야','너네 오늘 만난 지 3년이라고','댕균이 또 술 마시고 존나 운다'];
function time(){let d=new Date(),t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('#clock').textContent=t;$('#statusTime').textContent=t}time();setInterval(time,15000);
function sound(type='msg'){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx ||=new AC();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.connect(g);g.connect(ctx.destination);o.type='sine';if(type==='key'){o.frequency.value=720;g.gain.setValueAtTime(.035,n);g.gain.exponentialRampToValueAtTime(.001,n+.045);o.start(n);o.stop(n+.05)}else if(type==='bad'){o.frequency.setValueAtTime(180,n);o.frequency.setValueAtTime(140,n+.09);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.18);o.start(n);o.stop(n+.19)}else{o.frequency.setValueAtTime(880,n);o.frequency.setValueAtTime(1174,n+.09);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.08,n+.012);g.gain.setValueAtTime(.06,n+.07);g.gain.exponentialRampToValueAtTime(.0001,n+.23);o.start(n);o.stop(n+.24)}}catch(e){}}
function notify(text){let el=document.createElement('div');el.className='notif';el.innerHTML=`<div class="msgicon"><svg viewBox="0 0 40 40"><path d="M8 9.5A3.5 3.5 0 0 1 11.5 6h17A3.5 3.5 0 0 1 32 9.5v13a3.5 3.5 0 0 1-3.5 3.5H18l-7 5v-5h-.5A3.5 3.5 0 0 1 7 22.5v-13Z" fill="white"/></svg></div><div class="nbody"><div class="nhead"><span class="nname">이예은</span><span class="ntime">지금</span></div><div class="ntext"></div></div>`;el.querySelector('.ntext').textContent=text;el.onclick=openPass;notifs.appendChild(el);sound('msg')}
setTimeout(()=>notify(msgs[0]),3000);setTimeout(()=>notify(msgs[1]),4450);setTimeout(()=>notify(msgs[2]),5900);
function openPass(){if(unlocked)return;pass.classList.add('show');lock.style.pointerEvents='none';sound('key')}$('#swipe').onclick=openPass;$('#lockIndicator').onclick=openPass;lock.addEventListener('click',e=>{if(!e.target.closest('button'))openPass()});$('#camera').onclick=openPass;$('#flash').onclick=e=>{e.stopPropagation();e.currentTarget.style.background='#777';setTimeout(()=>e.currentTarget.style.background='',250)};
function dotsUpdate(){dots.forEach((d,i)=>d.classList.toggle('fill',i<value.length))}
function wrong(){sound('bad');$('#error').classList.add('show');$('#keys').classList.add('shake');value='';dotsUpdate();setTimeout(()=>{$('#error').classList.remove('show');$('#keys').classList.remove('shake')},650)}
function press(n){if(value.length>=4)return;sound('key');value+=n;dotsUpdate();if(value.length===4){if(value==='1020'){unlocked=true;setTimeout(()=>{pass.classList.remove('show');lock.classList.add('gone');home.classList.add('show')},180)}else setTimeout(wrong,160)}}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>press(b.dataset.n));$('#del').onclick=()=>{value=value.slice(0,-1);dotsUpdate();sound('key')};$('#cancel').onclick=()=>{pass.classList.remove('show');lock.style.pointerEvents='';value='';dotsUpdate()};$('#emergency').onclick=()=>{$('#error').textContent='긴급통화';$('#error').classList.add('show');setTimeout(()=>{$('#error').classList.remove('show');$('#error').textContent='암호가 올바르지 않습니다.'},800)};
function app(name){let titles={messages:'메시지',calendar:'캘린더',photos:'사진',camera:'카메라',notes:'메모',maps:'지도',mail:'메일',settings:'설정',phone:'전화',safari:'Safari',music:'음악',kakao:'카카오톡'};$('#title').textContent=titles[name]||'메시지';let html='';
if(name==='messages')html=`<div class="contact"><div class="avatar">이</div><b>이예은</b><div class="sub">iMessage</div></div><div class="chat"><div class="chattime">오늘</div>${msgs.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')}</div><div class="inputfake">iMessage</div>`;
else if(name==='calendar')html='<div class="sheet"><span style="color:#ff453a">10월 20일 화요일</span><h2>오늘</h2><div class="row">도원 씨 · 개인 일정<br><small>종일</small></div><div class="row">3주년<br><small>오늘</small></div></div>';

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.app').forEach(a=>a.addEventListener('click',()=>app(a.dataset.app)));$('#back').onclick=()=>view.classList.remove('show');
document.addEventListener('keydown',e=>{if(!pass.classList.contains('show'))return;if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace'){value=value.slice(0,-1);dotsUpdate()}if(e.key==='Escape')$('#cancel').click()});
})();
